# Render blueprint for the FaceHR API.
# First deploy: create a "Web Service" from this repo — Render picks this up
# automatically. Existing service: copy the values below into the dashboard.
services:
  - type: web
    name: facehr-api
    runtime: node
    rootDir: server
    plan: free
    # Skip optional native deps (TensorFlow) on the free tier: much faster builds,
    # lower memory, faster cold starts. Face attendance uses client descriptors.
    buildCommand: npm install --omit=optional
    startCommand: npm start
    # Applies committed Prisma migrations on every deploy (before new code goes live).
    releaseCommand: npm run db:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # --- set these in the Render dashboard (sync: false = you type the value) ---
      - key: DATABASE_URL
        sync: false # Neon connection string (sslmode=require&channel_binding=require)
      - key: DIRECT_URL
        sync: false # Neon direct connection string used for migrations (no -pooler)
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://facehr.vercel.app
      - key: UPLOAD_BASE_URL
        sync: false # this service's public URL, e.g. https://facehr-api.onrender.com
      - key: ADMIN_PASSWORD
        sync: false # strong password for the seeded admin account
      # --- optional (sensible defaults already in code) ---
      - key: ADMIN_EMAIL
        value: admin@facehr.com
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FACE_MATCH_THRESHOLD
        value: "0.6"
      # Free-tier tuning: keep server-side TF off, per-user rate limits, short caches.
      - key: FACE_SERVER_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "1" # use 2 if the API is behind Cloudflare
      - key: RATE_LIMIT_API_MAX
        value: "1200"
      - key: RATE_LIMIT_AUTH_MAX
        value: "100"
      - key: RATE_LIMIT_FACE_MAX
        value: "60"
      - key: DASHBOARD_CACHE_TTL_MS
        value: "15000"
      - key: ACTIVITY_CACHE_TTL_MS
        value: "15000"
      - key: LIST_CACHE_TTL_MS
        value: "60000"
      - key: OFFICE_START_TIME
        value: "09:30"
      - key: HALF_DAY_THRESHOLD_HOURS
        value: "4"
      - key: COMPANY_NAME
        value: FaceHR
